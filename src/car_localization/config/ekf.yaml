# robot_localization ekf_filter_node：轮速里程计 + 滤波 IMU 融合（ROS 2 Humble）
# 输入 /odom（diff_drive 编码器积分）与 /imu/data_filtered（car_localization/imu_filter 互补滤波）
# 输出 /odometry/filtered 与 TF odom->base_footprint（EKF 是该变换的唯一发布者；
# 仿真侧 diff_drive 插件 publish_odom_tf 默认 false, 裸仿真可 with_odom_tf:=true
# 改由插件发布, 见 car_description/urdf/car.gazebo.xacro）
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0          # 与 diff_drive 更新率一致
    sensor_timeout: 0.2      # 超时只做预测，不卡死输出
    two_d_mode: true         # 平面车：roll/pitch/z 及其速度强制为 0
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: false
    publish_tf: true
    publish_acceleration: false

    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom        # 连续估计器：odom->base_footprint

    # ---- 轮速里程计：只融合速度(vx, vyaw)，不融合绝对 x/y/yaw ----
    # 2026-10-15 航点回归 + gz 真值对账的实测教训：打滑使轮速航向持续偏(原地 ~15%，
    # 混合行驶 ~2.5%/rad)，而 diff_drive 插件的 covariance_yaw(0.001) 比 IMU 的
    # orientation_covariance(0.01) 小一个量级，Kalman 权重 ~91% 给了轮速——
    # 航点回归累计 ~64 rad 旋转后 odom->base 偏航误差涨到 1.5 rad。局部代价地图
    # 在 odom 系里按这个错误偏航插雷达点，涂抹出幻影墙把门洞封死，controller
    # 连刷 "Failed to make progress"，航点后半段全挂；AMCL 只能不断用 map->odom
    # 反向硬拉(累计 -1.4 rad)，RViz 里表现就是地图/定位来回漂移。
    # 轮速里程计的可信量是"走了多远、转得多快"，航向交给 IMU(仿真陀螺噪声 2e-4，
    # 互补滤波输出与真值偏差 <0.04 rad，实测远优于轮速)。
    odom0: /odom
    #        x      y      z     roll   pitch  yaw    vx     vy     vz
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
    #        vroll  vpitch vyaw  ax     ay     az
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # ---- 滤波 IMU：yaw(陀螺积分) + vyaw ----
    # roll/pitch 不喂（two_d_mode 会清零）；yaw 与 vyaw 同源但为官方模板推荐组合
    # ax/ay 不融合：r_l 按 IMU 姿态去重力，互补滤波的俯仰残差(~1°)会漏出
    # g*sin(δ)≈0.15 m/s² 的假加速度——比本车最大线加速度(~0.2)还大，纯添噪声；
    # 里程位置由上面的轮速 vx 积分即可，不需要加速度通道。
    imu0: /imu/data_filtered
    #        x      y      z     roll   pitch  yaw    vx     vy     vz
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
    #        vroll  vpitch vyaw  ax     ay     az
                  false, false, true,
                  false, false, false]

    # process_noise_covariance / initial_estimate_covariance 不设,
    # 用 robot_localization 内置默认（15x15 全矩阵, 官方模板值）;
    # 自定义必须给全 225 个元素, 缺失补零会协方差奇异导致 NaN 发散（实测）
    # 注: use_sim_time 下 gzserver 世界加载期（/clock 未起）EKF 会刷几秒
    # "NaNs were detected" 并自动复位, 时钟启动后恢复正常, TF 端会丢弃 NaN 变换（无害）
